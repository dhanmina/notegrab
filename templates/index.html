<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shhh</title>
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/form.css" />
    <link rel="stylesheet" href="/static/css/cards.css" />
    <link rel="stylesheet" href="/static/css/history.css" />
    <link rel="stylesheet" href="/static/css/flashcard.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <span class="app-name">shhh</span>
      </header>

      <!-- ── Top-level mode nav ── -->
      <div class="mode-nav">
        <button class="mode-btn active" id="modetab-downloads" type="button" onclick="setMode('downloads')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Downloads
        </button>
        <button class="mode-btn" id="modetab-flashcard" type="button" onclick="setMode('flashcard')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <line x1="2" y1="10" x2="22" y2="10"/>
          </svg>
          Flashcard
        </button>
      </div>

      <!-- ── Downloads mode ── -->
      <div id="mode-downloads">
        <section class="input-section">
          <div class="source-toggle">
            <button class="source-btn active" id="src-gdrive" type="button" onclick="setSource('gdrive')">
              <svg width="12" height="12" viewBox="0 0 87.3 78" fill="currentColor">
                <path d="M6.6 66.85l3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8H0c0 1.55.4 3.1 1.2 4.5z"/>
                <path d="M43.65 25L29.9 1.2C28.55 2 27.4 3.1 26.6 4.5L1.2 48.5c-.8 1.4-1.2 2.95-1.2 4.5h27.5z"/>
                <path d="M73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5H59.8l5.85 11.5z"/>
                <path d="M43.65 25L57.4 1.2C56.05.4 54.5 0 52.9 0H34.4c-1.6 0-3.15.45-4.5 1.2z"/>
                <path d="M59.8 53H27.5L13.75 76.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.4 4.5-1.2z"/>
                <path d="M73.4 26.5l-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3L43.65 25 59.8 53h27.45c0-1.55-.4-3.1-1.2-4.5z"/>
              </svg>
              GDrive
            </button>
            <button class="source-btn" id="src-zoom" type="button" onclick="setSource('zoom')">
              <svg width="13" height="13" viewBox="0 0 20 20" fill="currentColor">
                <path d="M2 6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2l3.333-1.667A1 1 0 0 1 19 7.28v5.44a1 1 0 0 1-1.667.748L14 12v2a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6z"/>
              </svg>
              Zoom
            </button>
            <button class="source-btn" id="src-gdocs" type="button" onclick="setSource('gdocs')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                <path d="M14 2H6a2 2 0 0 0-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
              </svg>
              GDocs
            </button>
            <button class="source-btn" id="src-gforms" type="button" onclick="setSource('gforms')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM8 7h8v2H8V7zm0 4h8v2H8v-2zm0 4h5v2H8v-2z"/>
              </svg>
              GForms
            </button>
          </div>

          <form id="dl-form">
            <div class="url-field">
              <input
                class="url-ta"
                id="url"
                type="text"
                placeholder="Paste a Google Drive video link"
                autocomplete="off"
                spellcheck="false"
                autofocus
              />
              <div class="url-fetch" id="url-fetch"></div>
            </div>
            <div class="url-error" id="url-error"></div>
            <div class="url-warn" id="url-warn"></div>

            <div class="password-row" id="password-row" style="display: none">
              <div class="password-wrap">
                <input
                  class="password-inp"
                  id="password-inp"
                  type="password"
                  placeholder="Recording password (if required)"
                  autocomplete="off"
                  spellcheck="false"
                />
                <button
                  class="pw-toggle"
                  type="button"
                  onclick="togglePassword()"
                  aria-label="Show password"
                >
                  <svg id="pw-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg id="pw-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                </button>
              </div>
            </div>

            <button class="dl-btn" id="dl-btn" type="submit" disabled>
              <span class="btn-spinner"></span>
              <span id="btn-text">Download</span>
            </button>
          </form>
        </section>

        <nav class="tab-bar">
          <button class="tab-btn active" id="tab-downloads" onclick="switchTab('downloads')">
            Downloads
            <span class="tab-badge" id="downloads-badge" style="display: none">0</span>
          </button>
          <button class="tab-btn" id="tab-history" onclick="switchTab('history')">
            History
          </button>
        </nav>

        <div class="tab-content">
          <div class="tab-pane active" id="pane-downloads">
            <div id="downloads-empty" class="empty-state">No active downloads</div>
            <div id="downloads-list" class="downloads-list"></div>
          </div>

          <div class="tab-pane" id="pane-history">
            <div class="history-toolbar">
              <button class="history-clear-btn" onclick="clearHistory()">Clear all</button>
            </div>
            <div id="history-empty" class="empty-state">No downloads yet</div>
            <div id="history-list" class="history-list"></div>
          </div>
        </div>
      </div>

      <!-- ── Flashcard mode ── -->
      <div id="mode-flashcard" style="display:none">

        <!-- ── Input screen ── -->
        <div id="fc-input-wrap">
          <p class="fc-field-label">Questionnaire link</p>
          <input
            class="fc-url-inp"
            id="fc-url"
            type="url"
            inputmode="url"
            placeholder="https://docs.google.com/forms/…"
            autocomplete="off"
            spellcheck="false"
          />

          <div class="fc-label-row">
            <p class="fc-field-label" style="margin-bottom:0">Answer key</p>
            <span class="fc-ans-count" id="fc-ans-count">0 entered</span>
          </div>
          <textarea
            class="fc-ans-ta"
            id="fc-ans"
            placeholder="a&#10;c&#10;d&#10;b&#10;&#10;One letter per line (a / b / c / d).&#10;100 lines for 100 questions."
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
            spellcheck="false"
          ></textarea>

          <div class="fc-error" id="fc-error"></div>

          <button class="fc-load-btn" id="fc-load-btn" type="button" disabled onclick="fcLoad()">
            Load Questions
          </button>
        </div>

        <!-- ── Loading ── -->
        <div id="fc-loading" style="display:none" class="fc-loading">
          <div class="fc-spin"></div>
          Parsing questions…
        </div>

        <!-- ── Study screen ── -->
        <div id="fc-study" style="display:none">

          <!-- Header bar -->
          <div class="fc-study-bar">
            <button class="fc-back-btn" type="button" onclick="fcExitStudy()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              Back
            </button>
            <div class="fc-study-meta">
              <span class="fc-counter" id="fc-counter">1 / ?</span>
              <span class="fc-score-wrap">
                <span class="fc-score-ok" id="fc-score-ok">0</span>
                <span class="fc-score-sep">·</span>
                <span class="fc-score-no" id="fc-score-no">0</span>
              </span>
            </div>
          </div>

          <!-- Progress bar -->
          <div class="fc-prog-bar">
            <div class="fc-prog-fill" id="fc-prog-fill"></div>
          </div>

          <!-- Question zone: fills remaining height, scrolls if text is long -->
          <div class="fc-q-zone">
            <div class="fc-question">
              <div class="fc-qnum" id="fc-qnum"></div>
              <div class="fc-qtext" id="fc-qtext"></div>
            </div>
          </div>

          <!-- Choices: always anchored to the same vertical band -->
          <div class="fc-choices-list" id="fc-choices-list"></div>

          <!-- Bottom bar: always at same position -->
          <div class="fc-next-bar">
          <button class="fc-next-btn" id="fc-next-btn" type="button" onclick="fcNext()">
            Next →
          </button>

          <!-- Keyboard hints (desktop only, hidden on mobile via CSS) -->
          <div class="fc-kbd">
            <span class="fc-kbd-item"><span class="fc-key">A</span><span class="fc-key">B</span><span class="fc-key">C</span><span class="fc-key">D</span> to answer</span>
            <span class="fc-kbd-item"><span class="fc-key">Enter</span> next</span>
          </div>

          </div><!-- /fc-next-bar -->

        </div><!-- /fc-study -->

        <!-- ── Done screen ── -->
        <div id="fc-done" style="display:none">
          <div class="fc-done-inner">

            <div class="fc-done-score">
              <div class="fc-done-pct" id="fc-done-pct">—</div>
              <div class="fc-done-label" id="fc-done-label"></div>
              <div class="fc-done-counts">
                <span class="ok" id="fc-done-ok">0 correct</span>
                <span>·</span>
                <span class="no" id="fc-done-no">0 incorrect</span>
              </div>
            </div>

            <div class="fc-done-actions">
              <button class="fc-done-btn primary"   type="button" onclick="fcDoShuffle()">⇌ Shuffle &amp; Try Again</button>
              <button class="fc-done-btn secondary"  type="button" onclick="fcDoRestart()">↺ Same Order</button>
              <button class="fc-done-btn ghost"      type="button" onclick="fcExitStudy()">✕ Exit</button>
            </div>

          </div>
        </div>

      </div>
    </div>

    <script src="/static/js/utils.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/history.js"></script>
    <script src="/static/js/cards.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/flashcard.js"></script>
  </body>
</html>
