<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>viddownload</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app">

      <header class="app-header">
        <span class="app-name">viddownload</span>
        <button class="key-btn" id="key-btn" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <span id="key-btn-label">Activate</span>
        </button>
      </header>

      <section class="input-section">

        <div class="source-toggle">
          <button class="source-btn active" id="src-gdrive" type="button" onclick="setSource('gdrive')">
            <svg width="13" height="13" viewBox="0 0 87.3 78" fill="currentColor">
              <path d="M6.6 66.85l3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8H0c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/>
              <path d="M43.65 25L29.9 1.2C28.55 2 27.4 3.1 26.6 4.5L1.2 48.5c-.8 1.4-1.2 2.95-1.2 4.5h27.5z" fill="#00ac47"/>
              <path d="M73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5H59.8l5.85 11.5z" fill="#ea4335"/>
              <path d="M43.65 25L57.4 1.2C56.05.4 54.5 0 52.9 0H34.4c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/>
              <path d="M59.8 53H27.5L13.75 76.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.4 4.5-1.2z" fill="#2684fc"/>
              <path d="M73.4 26.5l-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3L43.65 25 59.8 53h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/>
            </svg>
            Google Drive
          </button>
          <button class="source-btn" id="src-zoom" type="button" onclick="setSource('zoom')">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
              <path d="M2 6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2l3.333-1.667A1 1 0 0 1 19 7.28v5.44a1 1 0 0 1-1.667.748L14 12v2a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6z"/>
            </svg>
            Zoom
          </button>
        </div>

        <form id="dl-form">
          <div class="url-field">
            <textarea
              class="url-ta"
              id="url"
              rows="1"
              placeholder="Paste a Google Drive link"
              autocomplete="off"
              spellcheck="false"
              autofocus
            ></textarea>
            <div class="url-fetch" id="url-fetch"></div>
          </div>
          <div class="url-error" id="url-error"></div>
          <div class="url-warn"  id="url-warn"></div>

          <div class="password-row" id="password-row" style="display:none">
            <input
              class="password-inp"
              id="password-inp"
              type="password"
              placeholder="Recording password (if required)"
              autocomplete="off"
              spellcheck="false"
            />
          </div>

          <div class="bottom-row" id="bottom-row" style="display:none">
            <div class="stepper-row">
              <div class="stepper-label">
                <span class="stepper-name">Threads</span>
                <span class="stepper-desc">Parallel download connections</span>
              </div>
              <div class="stepper">
                <button class="step-btn" type="button" id="t-minus">−</button>
                <span class="step-val" id="t-val">8</span>
                <button class="step-btn" type="button" id="t-plus">+</button>
              </div>
            </div>
          </div>

          <button class="dl-btn" id="dl-btn" type="submit" disabled>
            <span class="btn-spinner"></span>
            <span id="btn-text">Download</span>
          </button>
        </form>
      </section>

      <nav class="tab-bar">
        <button class="tab-btn active" id="tab-downloads" onclick="switchTab('downloads')">
          Downloads
          <span class="tab-badge" id="downloads-badge" style="display:none">0</span>
        </button>
        <button class="tab-btn" id="tab-history" onclick="switchTab('history')">
          History
        </button>
      </nav>

      <div class="tab-content">

        <div class="tab-pane active" id="pane-downloads">
          <div id="downloads-empty" class="empty-state">No active downloads</div>
          <div id="downloads-list" class="downloads-list"></div>
        </div>

        <div class="tab-pane" id="pane-history">
          <div class="history-toolbar">
            <button class="history-clear-btn" onclick="clearHistory()">Clear all</button>
          </div>
          <div id="history-empty" class="empty-state">No downloads yet</div>
          <div id="history-list" class="history-list"></div>
        </div>

      </div>
    </div>

    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal" id="key-modal">
        <div class="modal-handle"></div>
        <div class="modal-title">Activation Key</div>
        <input
          class="key-inp"
          id="key-inp"
          type="text"
          placeholder="Enter key"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="modal-actions">
          <button class="modal-cancel" id="modal-cancel" type="button">Cancel</button>
          <button class="key-submit"   id="key-submit"   type="button">Unlock</button>
        </div>
        <span class="key-status" id="key-status"></span>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
