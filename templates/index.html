<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>viddownload</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">

  <header class="wm">
    <div class="wm-row">
      <div>
        <div class="wm-name">viddownload</div>
        <div class="wm-sub">Google Drive video downloader</div>
      </div>
      <button class="key-btn" id="key-btn" type="button">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span id="key-btn-label">Unlock</span>
      </button>
    </div>
  </header>

  <form id="dl-form">
    <div class="url-field">
      <textarea class="url-ta" id="url" rows="1"
        placeholder="{{ 'Paste a Google Drive link' if slots == 1 else 'Paste one or more Google Drive links, one per line' }}"
        autocomplete="off" spellcheck="false"></textarea>
      <div class="url-fetch" id="url-fetch"></div>
    </div>
    <div class="url-error" id="url-error"></div>
    <div class="url-warn"  id="url-warn"></div>

    <div class="bottom-row" id="bottom-row">
      <div class="field" id="name-field">
        <input class="inp name-inp" id="output" type="text"
          placeholder="Filename (auto-fills from Drive)">
        <span class="ext-chip" id="ext-chip"></span>
      </div>
      <div class="stepper" title="Download threads">
        <button class="step-btn" type="button" id="t-minus">−</button>
        <span class="step-val" id="t-val">4</span>
        <button class="step-btn" type="button" id="t-plus">+</button>
        <span class="step-label">threads</span>
      </div>
    </div>

    <button class="dl-btn" id="dl-btn" type="submit">
      <span class="btn-spinner"></span>
      <span id="btn-text">Download</span>
    </button>
  </form>

  <div class="sections">
    <div id="downloads-list" class="downloads-list"></div>

    <section id="history-section" class="history-section">
      <div class="history-head">
        <span class="history-label">History</span>
        <button class="history-clear-btn" onclick="clearHistory()">Clear all</button>
      </div>
      <div id="history-empty" class="history-empty">No downloads yet</div>
      <div id="history-list" class="history-list"></div>
    </section>
  </div>

</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="key-modal">
    <div class="modal-title">Activation Key</div>
    <input class="key-inp" id="key-inp" type="password" placeholder="Enter key" autocomplete="off" spellcheck="false">
    <div class="modal-actions">
      <button class="modal-cancel" id="modal-cancel" type="button">Cancel</button>
      <button class="key-submit" id="key-submit" type="button">Unlock</button>
    </div>
    <span class="key-status" id="key-status"></span>
  </div>
</div>

<script>let MAX_SLOTS = {{ slots }};</script>
<script src="/static/app.js"></script>
</body>
</html>
