<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>viddownload</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app">

      <header class="app-header">
        <span class="app-name">viddownload</span>
        <button class="key-btn" id="key-btn" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <span id="key-btn-label">Activate</span>
        </button>
      </header>

      <section class="input-section">
        <form id="dl-form">
          <div class="url-field">
            <textarea
              class="url-ta"
              id="url"
              rows="1"
              placeholder="Paste a Google Drive link"
              autocomplete="off"
              spellcheck="false"
              autofocus
            ></textarea>
            <div class="url-fetch" id="url-fetch"></div>
          </div>
          <div class="url-error" id="url-error"></div>
          <div class="url-warn"  id="url-warn"></div>

          <div class="bottom-row" id="bottom-row" style="display:none">
            <div class="stepper" title="Download threads">
              <button class="step-btn" type="button" id="t-minus">−</button>
              <span class="step-val" id="t-val">8</span>
              <button class="step-btn" type="button" id="t-plus">+</button>
              <span class="step-label">threads</span>
            </div>
          </div>

          <button class="dl-btn" id="dl-btn" type="submit" disabled>
            <span class="btn-spinner"></span>
            <span id="btn-text">Download</span>
          </button>
        </form>
      </section>

      <nav class="tab-bar">
        <button class="tab-btn active" id="tab-downloads" onclick="switchTab('downloads')">
          Downloads
          <span class="tab-badge" id="downloads-badge" style="display:none">0</span>
        </button>
        <button class="tab-btn" id="tab-history" onclick="switchTab('history')">
          History
        </button>
      </nav>

      <div class="tab-content">

        <div class="tab-pane active" id="pane-downloads">
          <div id="downloads-empty" class="empty-state">No active downloads</div>
          <div id="downloads-list" class="downloads-list"></div>
        </div>

        <div class="tab-pane" id="pane-history">
          <div class="history-toolbar">
            <button class="history-clear-btn" onclick="clearHistory()">Clear all</button>
          </div>
          <div id="history-empty" class="empty-state">No downloads yet</div>
          <div id="history-list" class="history-list"></div>
        </div>

      </div>
    </div>

    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal" id="key-modal">
        <div class="modal-handle"></div>
        <div class="modal-title">Activation Key</div>
        <input
          class="key-inp"
          id="key-inp"
          type="text"
          placeholder="Enter key"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="modal-actions">
          <button class="modal-cancel" id="modal-cancel" type="button">Cancel</button>
          <button class="key-submit"   id="key-submit"   type="button">Unlock</button>
        </div>
        <span class="key-status" id="key-status"></span>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
