<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>viddownload</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #09090b;
      --surface:   #111113;
      --border:    #1e1e22;
      --border-hi: #2e2e34;
      --text:      #efefef;
      --sub:       #777;
      --dim:       #3a3a3f;
      --blue:      #4285F4;
      --gred:      #EA4335;
      --yellow:    #FBBC05;
      --green:     #34A853;
      --accent:    #4285F4;
      --pink:      #EA4335;
      --red:       #EA4335;
      --mono: "SF Mono","Fira Code","Cascadia Code",ui-monospace,monospace;
      --sans: -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 40px 20px 80px;
    }

    .wrap {
      width: 100%;
      max-width: 460px;
      animation: boot 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes boot {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Wordmark ── */
    .wm {
      margin-bottom: 48px;
    }

    .wm-name {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sub);
    }

    .wm-sub {
      font-size: 0.68rem;
      color: var(--dim);
      margin-top: 4px;
    }

    /* ── Inputs ── */
    input[type="text"] {
      -webkit-appearance: none;
      appearance: none;
    }

    .field { position: relative; }

    .inp {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.92rem;
      padding: 13px 16px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .inp::placeholder { color: var(--dim); }

    .inp:focus {
      border-color: var(--border-hi);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.03);
    }

    /* URL field */
    .url-field { margin-bottom: 8px; }

    .url-inp { padding-right: 42px; }

    .url-inp.invalid { border-color: var(--gred); }

    .url-error {
      font-size: 0.72rem;
      color: var(--gred);
      margin-top: 6px;
      display: none;
      animation: rise 0.15s ease both;
    }

    .url-error.on { display: block; }

    .url-fetch {
      position: absolute;
      right: 14px; top: 50%;
      width: 14px; height: 14px;
      margin-top: -7px;
      border: 1.5px solid var(--border-hi);
      border-top-color: var(--sub);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    .url-fetch.on { opacity: 1; }

    /* Filename + threads row */
    .bottom-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 10px;
      align-items: start;
    }

    .name-inp {
      font-family: var(--mono);
      font-size: 0.78rem;
      padding: 10px 70px 10px 12px;
    }

    .name-inp::placeholder {
      font-family: var(--sans);
      font-size: 0.77rem;
    }

    .ext-chip {
      position: absolute;
      right: 8px; top: 50%;
      transform: translateY(-50%);
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--sub);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      pointer-events: none;
      white-space: nowrap;
      display: none;
    }

    /* Thread stepper */
    .stepper {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: hidden;
      height: 38px;
      user-select: none;
    }

    .step-btn {
      width: 32px;
      height: 100%;
      background: none;
      border: none;
      color: var(--sub);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.1s, background 0.1s;
      flex-shrink: 0;
    }

    .step-btn:hover { color: var(--text); background: var(--border); }
    .step-btn:active { background: var(--border-hi); }

    .step-val {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text);
      min-width: 30px;
      text-align: center;
      line-height: 1;
    }

    .step-label {
      font-size: 0.62rem;
      color: var(--dim);
      padding: 0 8px 0 2px;
      white-space: nowrap;
    }

    /* Download button */
    .dl-btn {
      width: 100%;
      padding: 13px;
      background: var(--pink);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-family: var(--sans);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: not-allowed;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, color 0.2s, opacity 0.12s, transform 0.08s;
      opacity: 0.55;
    }

    .dl-btn.valid {
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      opacity: 1;
    }

    .dl-btn.valid:hover { opacity: 0.87; }
    .dl-btn.valid:active { transform: scale(0.998); }
    .dl-btn:disabled { cursor: not-allowed; }

    .btn-spinner {
      width: 13px; height: 13px;
      border: 1.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.55s linear infinite;
      display: none;
    }

    .dl-btn.loading .btn-spinner { display: block; }

    /* ── Divider ── */
    .sep {
      height: 1px;
      background: var(--border);
      margin: 32px 0;
      opacity: 0;
      transition: opacity 0.25s;
    }

    .sep.on { opacity: 1; }

    /* ── State panels ── */
    .panel {
      display: none;
    }

    .panel.on {
      display: block;
      animation: rise 0.22s cubic-bezier(0.16,1,0.3,1) both;
    }

    .p-tag {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--sub);
      margin-bottom: 10px;
    }

    .p-tag.green { color: var(--green); }
    .p-tag.red   { color: var(--red); }

    /* ── Download panel ── */
    .dl-name {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 22px;
      min-height: 1.2em;
    }

    .dl-pct {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: -0.06em;
      line-height: 1;
      color: var(--text);
      margin-bottom: 16px;
      font-variant-numeric: tabular-nums;
      display: none;
    }

    .dl-pct sup {
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--sub);
      vertical-align: super;
    }

    .dl-pct-skeleton {
      height: 3.6rem;
      width: 110px;
      background: var(--surface);
      border-radius: 6px;
      margin-bottom: 16px;
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50%       { opacity: 0.65; }
    }

    .pbar {
      height: 2px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .pbar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      width: 0%;
      transition: width 0.3s ease;
    }

    .pbar-fill.indeterminate {
      width: 30% !important;
      animation: sweep 1.1s ease-in-out infinite;
    }

    @keyframes sweep {
      from { margin-left: -30%; }
      to   { margin-left: 110%; }
    }

    .dl-stats {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--sub);
    }

    /* ── Done panel ── */
    .done-file {
      font-family: var(--mono);
      font-size: 0.88rem;
      color: var(--text);
      margin-bottom: 3px;
    }

    .done-meta {
      font-size: 0.72rem;
      color: var(--sub);
      margin-bottom: 20px;
    }

    .done-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .save-btn {
      display: inline-flex;
      align-items: center;
      padding: 9px 18px;
      border: 1px solid var(--green);
      color: var(--green);
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.12s, color 0.12s;
    }

    .save-btn:hover {
      background: var(--green);
      color: #fff;
    }

    .new-btn {
      background: none;
      border: none;
      color: var(--sub);
      font-size: 0.78rem;
      cursor: pointer;
      padding: 0;
      transition: color 0.12s;
    }

    .new-btn:hover { color: var(--text); }

    /* ── Error panel ── */
    .err-msg {
      font-size: 0.84rem;
      color: #ccc;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .retry-btn {
      background: none;
      border: 1px solid var(--border-hi);
      color: var(--sub);
      border-radius: 6px;
      font-size: 0.78rem;
      padding: 7px 14px;
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s;
    }

    .retry-btn:hover { border-color: var(--sub); color: var(--text); }

    /* ── History ── */
    .history {
      margin-top: 40px;
      display: none;
    }

    .history.on { display: block; }

    .hist-hd {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .hist-label {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .hist-clr {
      background: none;
      border: none;
      font-size: 0.67rem;
      color: var(--dim);
      cursor: pointer;
      transition: color 0.12s;
    }

    .hist-clr:hover { color: var(--sub); }

    .hist-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .hist-row:last-child { border-bottom: none; }

    .hist-name {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    .hist-meta {
      font-size: 0.68rem;
      color: var(--sub);
      margin-top: 2px;
    }

    .hist-save {
      flex-shrink: 0;
      font-size: 0.7rem;
      color: var(--sub);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 10px;
      transition: border-color 0.12s, color 0.12s;
      white-space: nowrap;
    }

    .hist-save:hover { border-color: var(--border-hi); color: var(--text); }
  </style>
</head>
<body>
<div class="wrap">

  <header class="wm">
    <div class="wm-name">viddownload</div>
    <div class="wm-sub">Google Drive video downloader</div>
  </header>

  <form id="dl-form">
    <div class="field url-field">
      <input class="inp url-inp" id="url" type="text"
        placeholder="Paste a Google Drive link or file ID"
        autocomplete="off" spellcheck="false" required>
      <div class="url-fetch" id="url-fetch"></div>
    </div>
    <div class="url-error" id="url-error"></div>

    <div class="bottom-row">
      <div class="field">
        <input class="inp name-inp" id="output" type="text"
          placeholder="Filename (auto-fills from Drive)">
        <span class="ext-chip" id="ext-chip"></span>
      </div>
      <div class="stepper" title="Download threads">
        <button class="step-btn" type="button" id="t-minus">−</button>
        <span class="step-val" id="t-val">4</span>
        <button class="step-btn" type="button" id="t-plus">+</button>
        <span class="step-label">threads</span>
      </div>
    </div>

    <button class="dl-btn" id="dl-btn" type="submit">
      <span class="btn-spinner" id="btn-spinner"></span>
      <span id="btn-text">Download</span>
    </button>
  </form>

  <div class="sep" id="sep"></div>

  <!-- Downloading -->
  <div class="panel" id="p-dl">
    <div class="p-tag" id="p-dl-tag">Fetching info</div>
    <div class="dl-name" id="dl-name"></div>
    <div class="dl-pct-skeleton" id="dl-pct-skeleton"></div>
    <div class="dl-pct" id="dl-pct"></div>
    <div class="pbar"><div class="pbar-fill indeterminate" id="pbar"></div></div>
    <div class="dl-stats">
      <span id="dl-speed"></span>
      <span id="dl-size"></span>
    </div>
  </div>

  <!-- Done -->
  <div class="panel" id="p-done">
    <div class="p-tag green">Done</div>
    <div class="done-file" id="done-file"></div>
    <div class="done-meta" id="done-meta"></div>
    <div class="done-actions">
      <a class="save-btn" id="save-link" href="#">Save file</a>
      <button class="new-btn" type="button" id="new-btn">Download another →</button>
    </div>
  </div>

  <!-- Error -->
  <div class="panel" id="p-err">
    <div class="p-tag red">Error</div>
    <div class="err-msg" id="err-msg"></div>
    <button class="retry-btn" type="button" id="retry-btn">Try again</button>
  </div>

  <!-- History -->
  <div class="history" id="history">
    <div class="hist-hd">
      <span class="hist-label">Recent</span>
      <button class="hist-clr" type="button" id="hist-clr">Clear</button>
    </div>
    <div id="hist-list"></div>
  </div>

</div>
<script>
  // ── URL validation ──
  function isValidDriveUrl(val) {
    if (!val) return false;
    if (/drive\.google\.com\/(u\/\d+\/)?file\/d\/[a-zA-Z0-9_-]+/.test(val)) return true;
    if (/^[a-zA-Z0-9_-]{25,60}$/.test(val)) return true;
    return false;
  }

  let titleReady = false;

  function syncBtn() {
    const val   = document.getElementById('url').value.trim();
    const valid = isValidDriveUrl(val) && titleReady;
    const btn   = document.getElementById('dl-btn');
    btn.classList.toggle('valid', valid);
    btn.disabled = !valid;
  }

  syncBtn(); // init

  // ── State ──
  let threads = 4;

  function setPanel(name) {
    ['p-dl','p-done','p-err'].forEach(id => {
      document.getElementById(id).classList.remove('on');
    });
    const isIdle = name === 'idle';
    document.getElementById('sep').classList.toggle('on', !isIdle);
    document.getElementById('dl-form').style.display = isIdle ? '' : 'none';
    if (!isIdle) document.getElementById('p-' + name).classList.add('on');
  }

  function resetToIdle() {
    setPanel('idle');
    document.getElementById('dl-btn').classList.remove('loading');
    document.getElementById('btn-text').textContent = 'Download';
    syncBtn();
  }

  // ── Thread stepper ──
  document.getElementById('t-minus').addEventListener('click', () => {
    if (threads > 1) { threads--; document.getElementById('t-val').textContent = threads; }
  });
  document.getElementById('t-plus').addEventListener('click', () => {
    if (threads < 16) { threads++; document.getElementById('t-val').textContent = threads; }
  });

  // ── Auto-fill filename ──
  const nameInp  = document.getElementById('output');
  const extChip  = document.getElementById('ext-chip');
  const urlFetch = document.getElementById('url-fetch');
  let driveExt   = '';
  let titleTimer = null;

  document.getElementById('url').addEventListener('input', e => {
    clearTimeout(titleTimer);
    const v = e.target.value.trim();

    setUrlError('');

    if (!v) {
      titleReady = false;
      driveExt   = '';
      nameInp.value              = '';
      nameInp.style.paddingRight = '16px';
      extChip.style.display      = 'none';
      syncBtn();
      return;
    }

    titleReady = false;
    syncBtn();
    titleTimer = setTimeout(() => fetchTitle(v), 620);
  });

  function setUrlError(msg) {
    const el  = document.getElementById('url-error');
    const inp = document.getElementById('url');
    el.textContent = msg;
    el.classList.toggle('on', !!msg);
    inp.classList.toggle('invalid', !!msg);
  }

  async function fetchTitle(url) {
    urlFetch.classList.add('on');
    setUrlError('');
    try {
      const r = await fetch('/info', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      const data = await r.json();
      if (!r.ok || !data.title) {
        setUrlError('Could not fetch video info. Make sure the file is a video and is publicly accessible.');
        return;
      }
      const dot  = data.title.lastIndexOf('.');
      driveExt   = dot !== -1 ? data.title.slice(dot) : '';
      const base = dot !== -1 ? data.title.slice(0, dot) : data.title;
      nameInp.value              = base;
      nameInp.style.paddingRight = driveExt ? '72px' : '16px';
      extChip.textContent        = driveExt;
      extChip.style.display      = driveExt ? '' : 'none';
      titleReady = true;
      syncBtn();
    } catch {
      setUrlError('Network error — is the server running?');
    } finally {
      urlFetch.classList.remove('on');
    }
  }

  // ── Formatters ──
  function fmtB(b) {
    if (b >= 1e9) return (b/1e9).toFixed(2)+' GB';
    if (b >= 1e6) return (b/1e6).toFixed(1)+' MB';
    if (b >= 1e3) return (b/1e3).toFixed(0)+' KB';
    return b+' B';
  }
  function fmtSpd(bps) {
    if (bps >= 1e6) return (bps/1e6).toFixed(1)+' MB/s';
    if (bps >= 1e3) return (bps/1e3).toFixed(0)+' KB/s';
    return bps+' B/s';
  }
  function fmtEta(s) {
    if (!isFinite(s) || s <= 0) return '';
    if (s < 60)   return Math.ceil(s)+'s left';
    if (s < 3600) return Math.ceil(s/60)+'m left';
    return (s/3600).toFixed(1)+'h left';
  }

  // ── History ──
  const recents = [];

  function addRecent(jobId, filename, bytes, ms) {
    recents.unshift({ jobId, filename, bytes, ms });
    renderRecents();
  }

  function renderRecents() {
    const el   = document.getElementById('history');
    const list = document.getElementById('hist-list');
    if (!recents.length) { el.classList.remove('on'); return; }
    el.classList.add('on');
    list.innerHTML = recents.map(r => {
      const meta = [r.bytes ? fmtB(r.bytes) : '', r.ms ? (r.ms/1000).toFixed(1)+'s' : ''].filter(Boolean).join(' · ');
      return `<div class="hist-row">
        <div style="overflow:hidden;min-width:0;flex:1">
          <div class="hist-name">${esc(r.filename)}</div>
          ${meta ? `<div class="hist-meta">${meta}</div>` : ''}
        </div>
        <a class="hist-save" href="/download/${r.jobId}">Save</a>
      </div>`;
    }).join('');
  }

  document.getElementById('hist-clr').addEventListener('click', () => {
    recents.forEach(r => fetch(`/delete/${r.jobId}`, { method: 'DELETE' }));
    recents.length = 0;
    renderRecents();
  });

  document.getElementById('new-btn').addEventListener('click', resetToIdle);
  document.getElementById('retry-btn').addEventListener('click', resetToIdle);

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Submit ──
  document.getElementById('dl-form').addEventListener('submit', async e => {
    e.preventDefault();
    const urlVal    = document.getElementById('url').value.trim();
    const base      = nameInp.value.trim();
    const outputVal = base ? base + driveExt : '';

    const btn = document.getElementById('dl-btn');
    btn.disabled = true;
    btn.classList.add('loading');
    document.getElementById('btn-text').textContent = 'Starting…';

    setPanel('dl');
    document.getElementById('p-dl-tag').textContent = 'Fetching info';
    document.getElementById('dl-name').textContent  = '';
    document.getElementById('dl-pct').style.display        = 'none';
    document.getElementById('dl-pct').innerHTML             = '';
    document.getElementById('dl-pct-skeleton').style.display = '';
    document.getElementById('dl-speed').textContent = '';
    document.getElementById('dl-size').textContent  = '';

    const pbar = document.getElementById('pbar');
    pbar.className   = 'pbar-fill indeterminate';
    pbar.style.width = '';

    let res;
    try {
      res = await fetch('/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: urlVal, output: outputVal, threads, chunk_size: 65536 }),
      });
    } catch { showErr('Could not reach the server.'); return; }

    const data = await res.json();
    if (!res.ok) { showErr(data.error || 'Unknown error'); return; }

    btn.classList.remove('loading');
    document.getElementById('btn-text').textContent = 'Download';

    const { job_id } = data;
    const t0 = Date.now();
    let lb = 0, lt = t0, total = 0;

    const es = new EventSource(`/progress/${job_id}`);

    es.onmessage = ev => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'ping') return;

      if (msg.type === 'status') {
        if (msg.message.startsWith('Downloading:')) {
          document.getElementById('p-dl-tag').textContent = 'Downloading';
          document.getElementById('dl-name').textContent  = msg.message.replace('Downloading: ', '');
        } else {
          document.getElementById('p-dl-tag').textContent = msg.message;
        }
      }

      if (msg.type === 'progress') {
        total = msg.total;
        const now = Date.now(), dt = (now - lt) / 1000, db = msg.downloaded - lb;
        if (dt > 0.3) {
          const bps = db / dt;
          const eta = bps > 0 && msg.total > 0 ? (msg.total - msg.downloaded) / bps : Infinity;
          document.getElementById('dl-speed').textContent =
            fmtSpd(bps) + (eta < Infinity ? '  ·  ' + fmtEta(eta) : '');
          lb = msg.downloaded; lt = now;
        }
        if (msg.total > 0) {
          const pct = Math.min(100, (msg.downloaded / msg.total) * 100);
          pbar.className   = 'pbar-fill';
          pbar.style.width = pct.toFixed(1) + '%';
          document.getElementById('dl-pct-skeleton').style.display = 'none';
          document.getElementById('dl-pct').style.display = '';
          document.getElementById('dl-pct').innerHTML =
            Math.round(pct) + '<sup>%</sup>';
          document.getElementById('dl-size').textContent =
            fmtB(msg.downloaded) + ' / ' + fmtB(msg.total);
        } else {
          document.getElementById('dl-size').textContent = fmtB(msg.downloaded);
        }
      }

      if (msg.type === 'done') {
        es.close();
        const elapsed = Date.now() - t0;
        pbar.className = 'pbar-fill'; pbar.style.width = '100%';
        setPanel('done');
        document.getElementById('done-file').textContent = msg.filename;
        document.getElementById('done-meta').textContent =
          [total ? fmtB(total) : '', (elapsed/1000).toFixed(1)+'s'].filter(Boolean).join(' · ');
        document.getElementById('save-link').href = `/download/${job_id}`;
        addRecent(job_id, msg.filename, total, elapsed);
        syncBtn();
      }

      if (msg.type === 'error') {
        es.close();
        showErr(msg.message);
      }
    };

    es.onerror = () => { es.close(); showErr('Connection lost.'); };
  });

  function showErr(msg) {
    setPanel('err');
    document.getElementById('err-msg').textContent = msg;
    document.getElementById('dl-btn').classList.remove('loading');
    document.getElementById('btn-text').textContent = 'Download';
    syncBtn();
  }
</script>
</body>
</html>
