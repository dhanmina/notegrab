<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>viddownload</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #09090b;
      --surface:   #111113;
      --border:    #1e1e22;
      --border-hi: #2e2e34;
      --text:      #efefef;
      --sub:       #777;
      --dim:       #3a3a3f;
      --green:     #34A853;
      --accent:    #4285F4;
      --pink:      #EA4335;
      --red:       #EA4335;
      --mono: "SF Mono","Fira Code","Cascadia Code",ui-monospace,monospace;
      --sans: -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: grid;
      place-items: start center;
      padding: 40px 20px 80px;
    }

    .wrap {
      width: 100%;
      max-width: 460px;
      animation: boot 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes boot {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .wm { margin-bottom: 48px; }

    .wm-name {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sub);
    }

    .wm-sub {
      font-size: 0.68rem;
      color: var(--dim);
      margin-top: 4px;
    }

    /* ── URL textarea ── */
    .url-field { margin-bottom: 8px; position: relative; }

    .url-ta {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.92rem;
      padding: 13px 42px 13px 16px;
      outline: none;
      resize: none;
      overflow: hidden;
      line-height: 1.55;
      min-height: 48px;
      transition: border-color 0.15s, box-shadow 0.15s;
      display: block;
    }

    .url-ta::placeholder { color: var(--dim); }

    .url-ta:focus {
      border-color: var(--border-hi);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.03);
    }

    .url-ta.invalid { border-color: var(--red); }

    .url-fetch {
      position: absolute;
      right: 14px; top: 20px;
      width: 14px; height: 14px;
      border: 1.5px solid var(--border-hi);
      border-top-color: var(--sub);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }
    .url-fetch.on { opacity: 1; }

    .url-error {
      font-size: 0.72rem;
      color: var(--red);
      margin-top: 6px;
      display: none;
      animation: rise 0.15s ease both;
    }
    .url-error.on { display: block; }

    /* ── Bottom row ── */
    .bottom-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 10px;
      align-items: start;
    }

    .bottom-row.threads-only {
      grid-template-columns: auto;
      justify-content: end;
    }

    .field { position: relative; }

    .inp {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.92rem;
      padding: 13px 16px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .inp::placeholder { color: var(--dim); }
    .inp:focus {
      border-color: var(--border-hi);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.03);
    }

    .name-inp {
      font-family: var(--mono);
      font-size: 0.78rem;
      padding: 10px 70px 10px 12px;
    }

    .name-inp::placeholder {
      font-family: var(--sans);
      font-size: 0.77rem;
    }

    input[type="text"] { -webkit-appearance: none; appearance: none; }

    .ext-chip {
      position: absolute;
      right: 8px; top: 50%;
      transform: translateY(-50%);
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--sub);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      pointer-events: none;
      white-space: nowrap;
      display: none;
    }

    /* Thread stepper */
    .stepper {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: hidden;
      height: 38px;
      user-select: none;
    }

    .step-btn {
      width: 32px;
      height: 100%;
      background: none;
      border: none;
      color: var(--sub);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.1s, background 0.1s;
      flex-shrink: 0;
    }
    .step-btn:hover { color: var(--text); background: var(--border); }
    .step-btn:active { background: var(--border-hi); }

    .step-val {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text);
      min-width: 30px;
      text-align: center;
    }

    .step-label {
      font-size: 0.62rem;
      color: var(--dim);
      padding: 0 8px 0 2px;
      white-space: nowrap;
    }

    /* Download button */
    .dl-btn {
      width: 100%;
      padding: 13px;
      background: var(--pink);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-family: var(--sans);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: not-allowed;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, opacity 0.12s, transform 0.08s;
      opacity: 0.55;
    }

    .dl-btn.valid { background: var(--accent); cursor: pointer; opacity: 1; }
    .dl-btn.valid:hover { opacity: 0.87; }
    .dl-btn.valid:active { transform: scale(0.998); }
    .dl-btn:disabled { cursor: not-allowed; }

    .btn-spinner {
      width: 13px; height: 13px;
      border: 1.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.55s linear infinite;
      display: none;
    }
    .dl-btn.loading .btn-spinner { display: block; }

    /* ── Download cards ── */
    .downloads-list {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dl-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      animation: rise 0.22s cubic-bezier(0.16,1,0.3,1) both;
    }

    .dl-card.done    { border-color: rgba(52,168,83,0.3); }
    .dl-card.error   { border-color: rgba(234,67,53,0.3); }
    .dl-card.stopped { border-color: rgba(119,119,119,0.2); }
    .dl-card.paused .card-pbar-fill { background: var(--sub); }

    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .card-name {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 1;
    }

    .card-tag {
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--sub);
      flex-shrink: 0;
    }
    .card-tag.green { color: var(--green); }
    .card-tag.red   { color: var(--red); }

    .card-pbar {
      height: 2px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .card-pbar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      width: 0%;
      transition: width 0.3s ease;
    }

    .card-pbar-fill.indeterminate {
      width: 30% !important;
      animation: sweep 1.1s ease-in-out infinite;
    }

    @keyframes sweep {
      from { margin-left: -30%; }
      to   { margin-left: 110%; }
    }

    .card-stats {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 0.67rem;
      color: var(--sub);
    }

    .card-actions {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .save-btn {
      display: inline-flex;
      align-items: center;
      padding: 7px 16px;
      border: 1px solid var(--green);
      color: var(--green);
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.12s, color 0.12s;
    }
    .save-btn:hover { background: var(--green); color: #fff; }

    .dismiss-btn {
      background: none;
      border: none;
      color: var(--dim);
      font-size: 0.72rem;
      cursor: pointer;
      padding: 0;
      transition: color 0.12s;
    }
    .dismiss-btn:hover { color: var(--sub); }

    .ctrl-btn {
      background: none;
      border: 1px solid var(--border-hi);
      color: var(--dim);
      border-radius: 6px;
      font-size: 0.72rem;
      padding: 4px 12px;
      cursor: pointer;
      transition: color 0.1s, border-color 0.1s, background 0.1s;
    }
    .ctrl-btn:hover { color: var(--text); border-color: var(--sub); }
    .ctrl-btn.pause-btn:hover  { color: var(--accent); border-color: var(--accent); }
    .ctrl-btn.resume-btn { color: var(--accent); border-color: var(--accent); }
    .ctrl-btn.resume-btn:hover { background: rgba(66,133,244,0.08); }
    .ctrl-btn.stop-btn:hover   { color: var(--red); border-color: var(--red); }

    .card-err-msg {
      margin-top: 8px;
      font-size: 0.78rem;
      color: #ccc;
      line-height: 1.5;
    }
  </style>
</head>
<body>
<div class="wrap">

  <header class="wm">
    <div class="wm-name">viddownload</div>
    <div class="wm-sub">Google Drive video downloader</div>
  </header>

  <form id="dl-form">
    <div class="url-field">
      <textarea class="url-ta" id="url" rows="1"
        placeholder="Paste one or more Google Drive links, one per line"
        autocomplete="off" spellcheck="false"></textarea>
      <div class="url-fetch" id="url-fetch"></div>
    </div>
    <div class="url-error" id="url-error"></div>

    <div class="bottom-row" id="bottom-row">
      <div class="field" id="name-field">
        <input class="inp name-inp" id="output" type="text"
          placeholder="Filename (auto-fills from Drive)">
        <span class="ext-chip" id="ext-chip"></span>
      </div>
      <div class="stepper" title="Download threads">
        <button class="step-btn" type="button" id="t-minus">−</button>
        <span class="step-val" id="t-val">4</span>
        <button class="step-btn" type="button" id="t-plus">+</button>
        <span class="step-label">threads</span>
      </div>
    </div>

    <button class="dl-btn" id="dl-btn" type="submit">
      <span class="btn-spinner"></span>
      <span id="btn-text">Download</span>
    </button>
  </form>

  <div id="downloads-list" class="downloads-list"></div>

</div>
<script>
  function isValidDriveUrl(val) {
    if (!val) return false;
    if (/drive\.google\.com\/(u\/\d+\/)?file\/d\/[a-zA-Z0-9_-]+/.test(val)) return true;
    if (/^[a-zA-Z0-9_-]{25,60}$/.test(val)) return true;
    return false;
  }

  function getValidUrls(text) {
    return text.split('\n').map(l => l.trim()).filter(l => isValidDriveUrl(l));
  }

  function isMultiMode() {
    return document.getElementById('url').value.split('\n').map(l => l.trim()).filter(Boolean).length > 1;
  }

  let titleReady = false;
  let threads = 4;

  function syncBtn() {
    const urls  = getValidUrls(document.getElementById('url').value);
    const multi = isMultiMode();
    const valid = multi ? urls.length > 0 : (urls.length > 0 && titleReady);
    const btn   = document.getElementById('dl-btn');
    btn.classList.toggle('valid', valid);
    btn.disabled = !valid;
    document.getElementById('btn-text').textContent =
      multi && urls.length > 1 ? `Download ${urls.length}` : 'Download';
  }

  syncBtn();

  // ── Auto-resize textarea ──
  function resizeTa() {
    const ta = document.getElementById('url');
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }

  // ── Toggle single vs multi mode UI ──
  function updateMode() {
    const multi     = isMultiMode();
    const nameField = document.getElementById('name-field');
    const bottomRow = document.getElementById('bottom-row');
    nameField.style.display = multi ? 'none' : '';
    bottomRow.classList.toggle('threads-only', multi);
  }

  // ── Thread stepper ──
  document.getElementById('t-minus').addEventListener('click', () => {
    if (threads > 1) { threads--; document.getElementById('t-val').textContent = threads; }
  });
  document.getElementById('t-plus').addEventListener('click', () => {
    if (threads < 16) { threads++; document.getElementById('t-val').textContent = threads; }
  });

  const nameInp  = document.getElementById('output');
  const extChip  = document.getElementById('ext-chip');
  const urlFetch = document.getElementById('url-fetch');
  let driveExt   = '';
  let titleTimer = null;

  document.getElementById('url').addEventListener('input', e => {
    clearTimeout(titleTimer);
    resizeTa();
    updateMode();
    setUrlError('');

    const v = e.target.value.trim();

    if (!v) {
      titleReady = false;
      driveExt   = '';
      nameInp.value              = '';
      nameInp.style.paddingRight = '16px';
      extChip.style.display      = 'none';
      syncBtn();
      return;
    }

    if (isMultiMode()) {
      titleReady = true;
      syncBtn();
      return;
    }

    titleReady = false;
    syncBtn();
    titleTimer = setTimeout(() => fetchTitle(v), 620);
  });

  function setUrlError(msg) {
    const el  = document.getElementById('url-error');
    const ta  = document.getElementById('url');
    el.textContent = msg;
    el.classList.toggle('on', !!msg);
    ta.classList.toggle('invalid', !!msg);
  }

  async function fetchTitle(url) {
    urlFetch.classList.add('on');
    setUrlError('');
    try {
      const r = await fetch('/info', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      const data = await r.json();
      if (!r.ok || !data.title) {
        setUrlError('Could not fetch video info. Make sure the file is a video and is publicly accessible.');
        return;
      }
      const dot  = data.title.lastIndexOf('.');
      driveExt   = dot !== -1 ? data.title.slice(dot) : '';
      const base = dot !== -1 ? data.title.slice(0, dot) : data.title;
      nameInp.value              = base;
      nameInp.style.paddingRight = driveExt ? '72px' : '16px';
      extChip.textContent        = driveExt;
      extChip.style.display      = driveExt ? '' : 'none';
      titleReady = true;
      syncBtn();
    } catch {
      setUrlError('Network error — is the server running?');
    } finally {
      urlFetch.classList.remove('on');
    }
  }

  // ── Formatters ──
  function fmtB(b) {
    if (b >= 1e9) return (b/1e9).toFixed(2)+' GB';
    if (b >= 1e6) return (b/1e6).toFixed(1)+' MB';
    if (b >= 1e3) return (b/1e3).toFixed(0)+' KB';
    return b+' B';
  }
  function fmtSpd(bps) {
    if (bps >= 1e6) return (bps/1e6).toFixed(1)+' MB/s';
    if (bps >= 1e3) return (bps/1e3).toFixed(0)+' KB/s';
    return bps+' B/s';
  }
  function fmtEta(s) {
    if (!isFinite(s) || s <= 0) return '';
    if (s < 60)   return Math.ceil(s)+'s left';
    if (s < 3600) return Math.ceil(s/60)+'m left';
    return (s/3600).toFixed(1)+'h left';
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Card controls ──
  function setCardActions(jobId, state) {
    const act = document.getElementById(`cact-${jobId}`);
    if (!act) return;
    if (state === 'queued' || state === 'fetching') {
      act.innerHTML = `<button class="ctrl-btn stop-btn" onclick="stopJob('${jobId}')">Stop</button>`;
    } else if (state === 'downloading') {
      act.innerHTML = `
        <button class="ctrl-btn pause-btn" onclick="pauseJob('${jobId}')">Pause</button>
        <button class="ctrl-btn stop-btn" onclick="stopJob('${jobId}')">Stop</button>`;
    } else if (state === 'paused') {
      act.innerHTML = `
        <button class="ctrl-btn resume-btn" onclick="resumeJob('${jobId}')">Resume</button>
        <button class="ctrl-btn stop-btn" onclick="stopJob('${jobId}')">Stop</button>`;
    } else if (state === 'done') {
      act.innerHTML = `
        <a class="save-btn" href="/download/${jobId}">Save file</a>
        <button class="dismiss-btn" onclick="dismissCard('${jobId}')">Dismiss</button>`;
    } else {
      act.innerHTML = `<button class="dismiss-btn" onclick="dismissCard('${jobId}')">Dismiss</button>`;
    }
  }

  async function pauseJob(jobId) {
    await fetch(`/pause/${jobId}`, { method: 'POST' });
  }

  async function resumeJob(jobId) {
    await fetch(`/resume/${jobId}`, { method: 'POST' });
  }

  async function stopJob(jobId) {
    await fetch(`/stop/${jobId}`, { method: 'POST' });
  }

  // ── Cards ──
  function createCard(jobId) {
    const list = document.getElementById('downloads-list');
    const card = document.createElement('div');
    card.className = 'dl-card';
    card.id = `card-${jobId}`;
    card.innerHTML = `
      <div class="card-head">
        <div class="card-name" id="cname-${jobId}">—</div>
        <div class="card-tag" id="ctag-${jobId}">Queued</div>
      </div>
      <div class="card-pbar">
        <div class="card-pbar-fill indeterminate" id="cpbar-${jobId}"></div>
      </div>
      <div class="card-stats">
        <span id="cspd-${jobId}"></span>
        <span id="csz-${jobId}"></span>
      </div>
      <div class="card-actions" id="cact-${jobId}">
        <button class="ctrl-btn stop-btn" onclick="stopJob('${jobId}')">Stop</button>
      </div>
    `;
    list.insertBefore(card, list.firstChild);
    return card;
  }

  function trackJob(jobId, card) {
    const t0 = Date.now();
    let lb = 0, lt = t0, total = 0, finished = false;
    const es = new EventSource(`/progress/${jobId}`);

    es.onmessage = ev => {
      const msg  = JSON.parse(ev.data);
      if (msg.type === 'ping') return;

      const tag  = document.getElementById(`ctag-${jobId}`);
      const name = document.getElementById(`cname-${jobId}`);
      const pbar = document.getElementById(`cpbar-${jobId}`);
      const spd  = document.getElementById(`cspd-${jobId}`);
      const sz   = document.getElementById(`csz-${jobId}`);

      if (msg.type === 'queued') {
        tag.textContent = 'Queued';
        setCardActions(jobId, 'queued');
      }

      if (msg.type === 'status') {
        if (msg.message.startsWith('Downloading:')) {
          tag.textContent  = 'Downloading';
          name.textContent = msg.message.replace('Downloading: ', '');
          card.classList.remove('paused');
          setCardActions(jobId, 'downloading');
        } else {
          tag.textContent = msg.message;
          setCardActions(jobId, 'fetching');
        }
      }

      if (msg.type === 'progress') {
        total = msg.total;
        const now = Date.now(), dt = (now - lt) / 1000, db = msg.downloaded - lb;
        if (dt > 0.3) {
          const bps = db / dt;
          const eta = bps > 0 && msg.total > 0 ? (msg.total - msg.downloaded) / bps : Infinity;
          spd.textContent = fmtSpd(bps) + (eta < Infinity ? '  ·  ' + fmtEta(eta) : '');
          lb = msg.downloaded; lt = now;
        }
        if (msg.total > 0) {
          const pct = Math.min(100, (msg.downloaded / msg.total) * 100);
          pbar.className   = 'card-pbar-fill';
          pbar.style.width = pct.toFixed(1) + '%';
          sz.textContent   = fmtB(msg.downloaded) + ' / ' + fmtB(msg.total);
        } else {
          sz.textContent = fmtB(msg.downloaded);
        }
      }

      if (msg.type === 'paused') {
        tag.textContent = 'Paused';
        spd.textContent = '';
        card.classList.add('paused');
        setCardActions(jobId, 'paused');
      }

      if (msg.type === 'resumed') {
        tag.textContent = 'Downloading';
        card.classList.remove('paused');
        setCardActions(jobId, 'downloading');
      }

      if (msg.type === 'done') {
        es.close();
        finished = true;
        pbar.className   = 'card-pbar-fill';
        pbar.style.width = '100%';
        tag.textContent  = 'Done';
        tag.classList.add('green');
        name.textContent = msg.filename;
        spd.textContent  = '';
        sz.textContent   = [total ? fmtB(total) : '', ((Date.now()-t0)/1000).toFixed(1)+'s'].filter(Boolean).join(' · ');
        card.classList.add('done');
        card.classList.remove('paused');
        setCardActions(jobId, 'done');
      }

      if (msg.type === 'error') {
        es.close();
        finished = true;
        tag.textContent = 'Error';
        tag.classList.add('red');
        pbar.className   = 'card-pbar-fill';
        pbar.style.width = '0%';
        card.classList.add('error');
        card.insertAdjacentHTML('beforeend', `<div class="card-err-msg">${esc(msg.message)}</div>`);
        setCardActions(jobId, 'error');
      }

      if (msg.type === 'stopped') {
        es.close();
        finished = true;
        tag.textContent  = 'Stopped';
        spd.textContent  = '';
        sz.textContent   = '';
        pbar.className   = 'card-pbar-fill';
        pbar.style.width = '0%';
        card.classList.add('stopped');
        card.classList.remove('paused');
        setCardActions(jobId, 'stopped');
      }
    };

    es.onerror = () => {
      if (finished) return;
      es.close();
      finished = true;
      const tag  = document.getElementById(`ctag-${jobId}`);
      const pbar = document.getElementById(`cpbar-${jobId}`);
      if (!tag) return;
      tag.textContent = 'Error';
      tag.classList.add('red');
      pbar.className   = 'card-pbar-fill';
      pbar.style.width = '0%';
      card.classList.add('error');
      card.insertAdjacentHTML('beforeend', `<div class="card-err-msg">Connection lost.</div>`);
      setCardActions(jobId, 'error');
    };
  }

  function dismissCard(jobId) {
    fetch(`/delete/${jobId}`, { method: 'DELETE' });
    document.getElementById(`card-${jobId}`)?.remove();
  }

  function resetForm() {
    const ta = document.getElementById('url');
    ta.value           = '';
    ta.style.height    = '';
    nameInp.value              = '';
    nameInp.style.paddingRight = '16px';
    extChip.style.display      = 'none';
    driveExt   = '';
    titleReady = false;
    setUrlError('');
    updateMode();
    syncBtn();
    ta.focus();
  }

  // ── Submit ──
  document.getElementById('dl-form').addEventListener('submit', async e => {
    e.preventDefault();

    const urls = getValidUrls(document.getElementById('url').value);
    if (!urls.length) return;

    const multi     = urls.length > 1;
    const base      = nameInp.value.trim();
    const outputVal = (!multi && base) ? base + driveExt : '';

    const btn = document.getElementById('dl-btn');
    btn.disabled = true;
    btn.classList.add('loading');
    document.getElementById('btn-text').textContent = 'Starting…';

    const results = await Promise.all(urls.map(url =>
      fetch('/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, output: outputVal, threads, chunk_size: 65536 }),
      }).then(r => r.json().then(d => ({ ok: r.ok, data: d }))).catch(() => null)
    ));

    btn.classList.remove('loading');
    document.getElementById('btn-text').textContent = 'Download';

    let anyStarted = false;
    for (const result of results) {
      if (!result || !result.ok) continue;
      const card = createCard(result.data.job_id);
      trackJob(result.data.job_id, card);
      anyStarted = true;
    }

    if (!anyStarted) {
      setUrlError('Failed to start downloads. Is the server running?');
      syncBtn();
      return;
    }

    resetForm();
  });
</script>
</body>
</html>
